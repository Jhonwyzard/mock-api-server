<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Mock Server - Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f9fafb;
            color: #111827;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            width: 100%;
            max-width: 360px;
            padding: 1.75rem 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .brand-header {
            margin-bottom: 1.25rem;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 0.75rem;
        }

        .brand-header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 0.15rem;
        }

        .brand-header p {
            color: #4b5563;
            font-size: 0.8rem;
        }

        .error-alert {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 0.85rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .form-group input {
            width: 100%;
            background: #ffffff;
            border: 1px solid #cccccc;
            color: #111827;
            border-radius: 4px;
            padding: 0.5rem 0.75rem;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        .btn-submit {
            width: 100%;
            background: #111827;
            color: #ffffff;
            border: 1px solid #111827;
            border-radius: 4px;
            padding: 0.55rem;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .btn-submit:hover {
            background: #1f2937;
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-header">
            <h1>API Mock Server</h1>
            <p>Dashboard Sign In</p>
        </div>

        <div id="errorAlert" class="error-alert">Invalid username or password</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" required autofocus autocomplete="username" spellcheck="false">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
            </div>


            <button type="submit" id="submitBtn" class="btn-submit">
                <span>Sign In</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorAlert = document.getElementById('errorAlert');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.querySelector('span').innerText = 'Verifying...';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/logs/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({ username, password })
                });

                if (response.ok) {
                    window.location.href = '/logs';
                } else {
                    const data = await response.json().catch(() => ({}));
                    errorAlert.innerText = data.detail || 'Invalid username or password';
                    errorAlert.style.display = 'block';
                }
            } catch (err) {
                errorAlert.innerText = 'Connection error. Please try again.';
                errorAlert.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.querySelector('span').innerText = 'Sign In';
            }
        });
    </script>
</body>
</html>
